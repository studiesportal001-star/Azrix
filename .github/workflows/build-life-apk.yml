name: Build Life APK

on:
  push:
    branches: [ main, master ]
    # only the life app (health, growth, wealth, savings) rebuilds this one
    paths:
      - "azrix-jr-life-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azrix-jr-life-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azrix-jr-life-debug-apk
          path: azrix-jr-life-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
