name: Build Azrix_v2 APK

on:
  push:
    branches: [ main, master ]
    # only the Azrix_v2 app (health, growth, wealth, savings) rebuilds this one
    paths:
      - "Azrix_v2/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azrix_v2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Azrix_v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azrix_v2-apk
          path: Azrix_v2/app/build/outputs/apk/debug/Azrix_v2.apk
          if-no-files-found: error
